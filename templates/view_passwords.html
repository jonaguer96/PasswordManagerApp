{% extends 'base.html' %}
{% block title %}Stored Passwords{% endblock %}
{% block content %}
<h2>Stored Passwords</h2>
<table class="table table-striped">
  <thead><tr><th>Site</th><th>Password</th></tr></thead>
  <tbody>
  {% for site, password in passwords %}
  <tr>
    <td>{{ site }}</td>
    <td>
      <input type="password" value="{{ password }}" id="pw-{{ loop.index }}" readonly style="border:none; background:none;">
      <button type="button" class="btn btn-sm btn-outline-primary" onclick="togglePassword('{{ loop.index }}')">Show/Hide</button>
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table>
<a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
<script>
function togglePassword(index) {
    var pwField = document.getElementById('pw-' + index);
    if (pwField.type === "password") {
        pwField.type = "text";
    } else {
        pwField.type = "password";
    }
}
</script>
{% endblock %}
